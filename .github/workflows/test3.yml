name: test_pipeline_2
on:
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: install requirements
        run: pip install -r requirements.txt
      - name: Print python version
        run: python3 --version
      - name: Run tests
        run: pytest
  deploy_hekuro:
